name: facuso-validacion
services:
  zip-wp:
    image: wordpress:7.1.3-php8.3-apache@sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5
    environment:
      WORDPRESS_DB_HOST: facuso-importacion-db-1
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX: facuso_ziptest_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    secrets: [db_password, admin_password]
    volumes:
      - wordpress_validation:/var/www/html
      - ../dist:/importacion:ro
      - ../research/wordpress-importer.zip:/pruebas/wordpress-importer.zip:ro
      - ../scripts:/pruebas/scripts:ro
      - ./php-limits.ini:/usr/local/etc/php/conf.d/facuso-limits.ini:ro
    networks: [local]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
  zip-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on: [zip-wp]
    ports: [127.0.0.1:18087:80]
    volumes: [./nginx-validation.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [local, acceso]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
secrets:
  db_password: {file: .secrets/db_password}
  admin_password: {file: .secrets/admin_password}
volumes:
  wordpress_validation:
networks:
  local: {external: true, name: facuso-importacion_local}
  acceso: {external: true, name: facuso-importacion_acceso}
