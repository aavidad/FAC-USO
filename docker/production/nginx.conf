worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
    server {
        listen 8080 default_server;
        server_name facuso.cidonia.cloud;
        if ($host != facuso.cidonia.cloud) { return 444; }
        client_max_body_size 20m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location = /xmlrpc.php { return 403; }
        location = /wp-config.php { return 404; }
        location = /readme.html { return 404; }
        location = /wp-admin/install.php { return 404; }
        location ~* ^/wp-admin/(install|setup-config)\.php(/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* /wp-content/uploads/.*\.(php[0-9]?|phtml|phar)(/|$) { return 403; }
        location ~* \.(sql|bak|env|log|ini)$ { return 404; }
        location = /wp-login.php {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://facuso-cidonia-wordpress-1:80;
            proxy_set_header Host facuso.cidonia.cloud;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / {
            proxy_pass http://facuso-cidonia-wordpress-1:80;
            proxy_set_header Host facuso.cidonia.cloud;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 180s;
        }
    }
}
