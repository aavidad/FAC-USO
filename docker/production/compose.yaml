name: facuso-cidonia
x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: facuso
      MARIADB_USER: facuso
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - {source: db_service_password, target: db_password}
      - db_root_password
    volumes: [database:/var/lib/mysql]
    networks: [datos]
    mem_limit: 512m
    cpus: 0.7
    pids_limit: 128
    logging: *logs
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      WORDPRESS_DB_HOST: facuso-cidonia-db-1
      WORDPRESS_DB_USER: facuso
      WORDPRESS_DB_NAME: facuso
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      FACUSO_DOMAIN: facuso.cidonia.cloud
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('WP_HOME', 'https://facuso.cidonia.cloud');
        define('WP_SITEURL', 'https://facuso.cidonia.cloud');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    secrets: [db_password, admin_password]
    volumes:
      - wordpress:/var/www/html
      - ../../dist/facuso-arranque.zip:/import/facuso-arranque.zip:ro
      - ./:/setup:ro
      - ../../bot/provision_wordpress.php:/tools/provision_wordpress.php:ro
      - ../../.secrets/provision:/private
      - ../php-limits.ini:/usr/local/etc/php/conf.d/facuso.ini:ro
    networks: [datos, acceso]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging: *logs
  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on: [wordpress]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: [127.0.0.1:18086:8080]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [acceso, frontal]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.3
    pids_limit: 32
    logging: *logs
secrets:
  db_password: {file: ../../.secrets/db_password}
  db_service_password: {file: ../../.secrets/db_service_password}
  db_root_password: {file: ../../.secrets/db_root_password}
  admin_password: {file: ../../.secrets/admin_password}
volumes:
  database:
  wordpress:
networks:
  datos: {internal: true}
  acceso:
  frontal: {external: true, name: catalogo-juegos_privada}
