name: facuso-importacion
services:
  db:
    restart: unless-stopped
    image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes: [database:/var/lib/mysql]
    networks: [local]
    mem_limit: 512m
    cpus: 1
    pids_limit: 180
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    restart: unless-stopped
    image: wordpress:7.1.3-php8.3-apache@sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5
    depends_on:
      db: {condition: service_healthy}
    environment:
      WORDPRESS_DB_HOST: facuso-importacion-db-1
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    secrets: [db_password, admin_password]
    volumes:
      - wordpress:/var/www/html
      - ../dist:/importacion:ro
      - ../scripts:/pruebas:ro
      - ./php-limits.ini:/usr/local/etc/php/conf.d/facuso-import.ini:ro
    networks: [local]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 180
  proxy:
    restart: unless-stopped
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on: [wordpress]
    ports: [127.0.0.1:18086:80]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
    networks: [local, acceso]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
secrets:
  db_password: {file: .secrets/db_password}
  db_root_password: {file: .secrets/db_root_password}
  admin_password: {file: .secrets/admin_password}
volumes:
  database:
  wordpress:
networks:
  local:
    internal: true
    ipam:
      config:
        - subnet: 10.238.86.0/28
  acceso:
    ipam:
      config:
        - subnet: 10.238.87.0/28
